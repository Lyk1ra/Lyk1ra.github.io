favicon: /img/favicon.png

# Change to your profile picture
avatar: /images/avatar.jpg?v=a04f519
# if author sets in hexo_config, this string doesn't work
author: "Liu Xuan'ang"
author_bio: 'AI Efficiency & Quantization · Incoming PhD Student in World Models'

since: 2023

# Top Menu 顶部菜单
# #title 为页内跳转，单页模式
# 可以选择外链或其他页面
menu:
  Research: /#research
  Education: /#education
  Publications: /#publications
  Projects: /#projects
  Awards: /#awards

# flink picture will load if avator link calls on error
loading_bg:
  flink: /img/profile.png

# Social Links; 社交链接，不需要的链接直接注释掉
# 可以调整显示顺序
# 图标调用 font-awesome 4.7
social:
  enable: true
social_links:
  fab fa-github: https://github.com/Lyk1ra

# Additional social_links，额外添加自定义链接，可显示链接名称
# name: url || icon_name
e_social:
  enable: false
e_social_links:

# CV download link
cv_dl:
  enable: true
  dir: /attaches/CV.pdf?v=1bef0a4
  description: Download CV (PDF)

# Box-shadow
# display box-shadow on page or not
box_shadow:
  enable: false

# CDN
# 根据需要自行添加js/css
# 自定义css可以直接写在user.styl中
CDN_USE:
  css:
    - /css/index.css
    - /css/academia-overrides.css
#    - https://cdn.jsdelivr.net/npm/font-awesome@latest/css/font-awesome.min.css
    - https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.13.0/css/all.min.css # fontawesome 5
  js:
    - https://cdn.jsdelivr.net/npm/jquery@latest/dist/jquery.min.js #/js/third-party/jquery.min.js
    - https://cdn.jsdelivr.net/npm/jquery-pjax@latest/jquery.pjax.min.js
    - /js/main.js
